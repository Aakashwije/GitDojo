name: CI

on:
  # Branches are covered by their pull requests; pushes to main feed the release workflow.
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      performance:
        description: Run the additional Node and browser stress scenarios
        type: boolean
        default: false
  schedule:
    # Monday 02:30 UTC (08:00 Asia/Colombo).
    - cron: "30 2 * * 1"

concurrency:
  # Keep push, PR, manual and scheduled runs from cancelling one another.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Quality / ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [format, lint, typecheck, workflows]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Check formatting
        if: matrix.check == 'format'
        run: pnpm format:check
      - name: Lint
        if: matrix.check == 'lint'
        run: pnpm lint
      - name: Typecheck
        if: matrix.check == 'typecheck'
        run: pnpm typecheck
      # A Go that satisfies actionlint's `go` directive, so `go install` never auto-downloads a
      # toolchain from golang.org (which can advertise versions it cannot serve yet).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.check == 'workflows'
        with:
          go-version: "1.25"
          cache: false
      - name: Validate GitHub Actions workflows
        if: matrix.check == 'workflows'
        env:
          GOTOOLCHAIN: local
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

  unit:
    name: Unit tests / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node }}
      - name: Unit and integration tests
        run: pnpm exec turbo run test -- --reporter=default --reporter=junit --outputFile=junit.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-results-node-${{ matrix.node }}
          path: |
            apps/*/junit.xml
            packages/*/junit.xml
          if-no-files-found: warn
          retention-days: 14

  database:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gitdojo
          POSTGRES_PASSWORD: gitdojo
          POSTGRES_DB: gitdojo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gitdojo -d gitdojo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Migrations, isolation and concurrent completions
        run: pnpm --filter @gitdojo/web test:db --reporter=default --reporter=junit --outputFile=db-junit.xml
        env:
          # Disposable service credentials; never point this job at a production database.
          TEST_DATABASE_URL: postgres://gitdojo:gitdojo@localhost:5432/gitdojo_test
      - name: Upload database test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-results
          path: apps/web/db-junit.xml
          if-no-files-found: warn
          retention-days: 14

  content:
    name: Content validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - run: pnpm validate:content

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Cache Next.js compiler output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build with test-only public identity settings
        # Direct invocation keeps the explicit environment overrides (Turbo uses strict env).
        run: pnpm --filter @gitdojo/web build
        env:
          # The SDK inlines these at build time. They must match playwright.config.ts.
          # Runtime configuration still keeps the anonymous server's accounts disabled.
          NEXT_PUBLIC_ASGARDEO_BASE_URL: http://localhost:3199/t/gitdojo
          NEXT_PUBLIC_ASGARDEO_CLIENT_ID: gitdojo-e2e-client
          ASGARDEO_CLIENT_SECRET: ""
          ASGARDEO_SECRET: ""
          DATABASE_URL: ""
      - name: Package the tested build
        # Tar retains hidden files and symlinks. No .env files or node_modules are included.
        run: tar --exclude=.next/cache --exclude=.next/dev -czf "$RUNNER_TEMP/gitdojo-build.tar.gz" -C apps/web .next public/monaco
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-build
          path: ${{ runner.temp }}/gitdojo-build.tar.gz
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Browser / ${{ matrix.project }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-build
          path: ${{ runner.temp }}/gitdojo-build
      - name: Restore production build
        run: |
          tar -xzf "$RUNNER_TEMP/gitdojo-build/gitdojo-build.tar.gz" -C apps/web
          test -s apps/web/.next/BUILD_ID
      - uses: ./.github/actions/setup-playwright
      - name: Production browser and accessibility tests
        # Call Playwright directly: the upstream build is reused rather than rebuilt by Turbo.
        run: pnpm --filter @gitdojo/web exec playwright test --project="$PLAYWRIGHT_PROJECT" --workers=2
        env:
          PLAYWRIGHT_PROJECT: ${{ matrix.project }}
      - name: Upload browser reports and failure traces
        # Test data only: mock identity provider users and a disposable database.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-results-${{ matrix.project }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: warn
          retention-days: 14

  accounts:
    name: Accounts / ${{ matrix.project }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: auth-flow
            browser: chromium
          - project: account-chromium
            browser: chromium
          - project: account-firefox
            browser: firefox
    # Sign-in against the mock identity provider and account progress against real PostgreSQL.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gitdojo
          POSTGRES_PASSWORD: gitdojo
          POSTGRES_DB: gitdojo_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gitdojo -d gitdojo_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable service credentials; never point this job at a real database.
      E2E_DATABASE_URL: postgres://gitdojo:gitdojo@localhost:5432/gitdojo_e2e_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-build
          path: ${{ runner.temp }}/gitdojo-build
      - name: Restore production build
        run: |
          tar -xzf "$RUNNER_TEMP/gitdojo-build/gitdojo-build.tar.gz" -C apps/web
          test -s apps/web/.next/BUILD_ID
      - name: Migrate the test database
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
      - uses: ./.github/actions/setup-playwright
        with:
          browser: ${{ matrix.browser }}
      - name: Account browser tests
        # Account isolation, duplicate XP, sign-out and ended sessions, against PostgreSQL.
        run: pnpm --filter @gitdojo/web exec playwright test --project="$PLAYWRIGHT_PROJECT" --workers=2
        env:
          PLAYWRIGHT_PROJECT: ${{ matrix.project }}
      - name: Upload browser reports and failure traces
        # Test data only: mock identity provider users and a disposable database.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-results-${{ matrix.project }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: warn
          retention-days: 14

  performance:
    name: Performance stress scenarios
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.performance)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-build
          path: ${{ runner.temp }}/gitdojo-build
      - run: tar -xzf "$RUNNER_TEMP/gitdojo-build/gitdojo-build.tar.gz" -C apps/web
      - uses: ./.github/actions/setup-playwright
      - name: Node stress scenarios
        run: pnpm perf 2>&1 | tee "$RUNNER_TEMP/performance-node.log"
      - name: Browser stress scenarios
        run: pnpm --filter @gitdojo/web perf:browser 2>&1 | tee "$RUNNER_TEMP/performance-browser.log"
      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-results
          path: |
            ${{ runner.temp }}/performance-*.log
            apps/web/test-results
          if-no-files-found: warn
          retention-days: 14

  required:
    name: CI required
    if: always()
    needs: [quality, unit, database, content, audit, build, browser, accounts, performance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize and enforce all required results
        env:
          RESULTS: ${{ toJSON(needs) }}
          # Performance is optional, but must pass whenever it was asked for.
          PERFORMANCE_REQUESTED: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.performance) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ["RESULTS"])
          optional = {"performance"} if os.environ["PERFORMANCE_REQUESTED"] != "true" else set()
          failed = []
          lines = ["## CI results", "", "| Job | Result |", "| --- | --- |"]
          for name, job in results.items():
              result = job["result"]
              lines.append(f"| {name} | {result} |")
              # Failed, cancelled and unexpectedly skipped jobs all block.
              allowed = {"success", "skipped"} if name in optional else {"success"}
              if result not in allowed:
                  failed.append(name)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n".join(lines) + "\n")
          if failed:
              print("Required jobs did not pass: " + ", ".join(
                  f"{name} ({results[name]['result']})" for name in failed), file=sys.stderr)
              if all(results[name]["result"] == "cancelled" for name in failed):
                  # Two very different causes report as "cancelled", so name both: a superseded
                  # run is nothing to fix, a job that hit timeout-minutes very much is.
                  print("::notice::Jobs were cancelled rather than failed. Either a newer commit "
                        "superseded this run (check that commit's run instead), or a job hit its "
                        "timeout-minutes, which GitHub also reports as cancelled - open the job "
                        "and check the duration of its last step.", file=sys.stderr)
              sys.exit(1)
          PY
