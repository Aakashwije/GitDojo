name: Release

# Deploys main to staging after CI, then opens a draft GitHub Release for review.
# Vercel builds each release from source with its own environment variables; CI's test build
# (mock identity provider settings) is never deployed. Git-triggered production deployments are
# disabled in apps/web/vercel.json, so this workflow is the only way to production.
# Production deploys only from the published release event (.github/workflows/publish.yml).
# Setup: docs/deployment.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Releases and their migrations run one at a time and are never cancelled midway.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  VERCEL_CLI: vercel@62.2.0
  VERCEL_TELEMETRY_DISABLED: "1"

jobs:
  gate:
    name: Release gate
    # Only CI runs for pushes to main in this repository; never pull requests or forks.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      release: ${{ steps.commit.outputs.release }}
    steps:
      - name: Choose the commit and confirm CI passed for it
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$REF" != "refs/heads/main" ]; then
              echo "::error::Releases run from main only."
              exit 1
            fi
            sha="$DISPATCH_SHA"
            result=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?check_name=CI%20required" \
              --jq '[.check_runs[] | .conclusion] | first // "missing"')
            if [ "$result" != "success" ]; then
              echo "::error::'CI required' is '$result' for $sha. Releases need a passing CI run."
              exit 1
            fi
          else
            sha="$CI_SHA"
          fi
          # CI runs can finish out of order; releasing an older commit would roll production back.
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$sha" != "$head" ]; then
            echo "::notice::$sha is no longer the head of main ($head); that commit will be released instead."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  staging:
    name: Staging
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      statuses: write
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Mark staging deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" --method POST -f state=pending -f context='GitDojo staging' -f description='Staging deployment and smoke test are running.' -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Check release configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          missing=()
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID DATABASE_URL_UNPOOLED STAGING_URL; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::The staging environment is missing: ${missing[*]}. See docs/deployment.md."
            exit 1
          fi
      - name: Migrate the staging database
        run: pnpm db:migrate
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      - name: Deploy to staging
        # The staging project's production target owns the stable staging domain.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          url=$(npx --yes "$VERCEL_CLI" deploy --prod --yes --token "$VERCEL_TOKEN" --meta "gitSha=$SHA")
          echo "Deployed $url"
          echo "### Staging: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test staging
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node apps/web/scripts/smoke.mjs "$STAGING_URL" --expect-accounts --expect-database
      - name: Mark staging verified
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.gate.outputs.sha }}
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" --method POST -f state=success -f context='GitDojo staging' -f description='Staging deployment and smoke test passed.' -f target_url="$STAGING_URL"
      - name: Mark staging failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" --method POST -f state=failure -f context='GitDojo staging' -f description='Staging deployment or smoke test failed.' -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  draft-release:
    name: Create draft release for approval
    needs: [gate, staging]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create a draft with generated release notes
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.gate.outputs.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          tag="v0.1.$RUN_NUMBER"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            existing_target=$(jq -r .target_commitish "$RUNNER_TEMP/release.json")
            if [ "$existing_target" != "$SHA" ]; then
              echo "::error::Release $tag already exists for $existing_target, not $SHA. Refusing to reuse it."
              exit 1
            fi
            echo "Release $tag already exists for this commit; leaving it unchanged."
          else
            gh release create "$tag" --target "$SHA" --title "GitDojo $tag" --generate-notes --draft
            # The learner announcement goes first; the generated changelog stays below it.
            gh release view "$tag" --json body --jq .body > "$RUNNER_TEMP/changelog.md"
            cat .github/release-highlights-template.md "$RUNNER_TEMP/changelog.md" > "$RUNNER_TEMP/release-notes.md"
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          {
            echo "### Draft release ready for review"
            echo "Open **Releases** in GitHub, write 1–5 learner-focused bullets under **Highlights for learners** (see docs/release-notes.md), review the full notes, then click **Publish release** to approve the production deployment."
          } >> "$GITHUB_STEP_SUMMARY"
