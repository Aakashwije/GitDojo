# Challenge: Branching
# Schema and authoring guide: docs/lesson-authoring.md
# Challenges describe the end state and never prescribe commands, including in hints.
id: branching-challenge
slug: branching-challenge
title: Branching Challenge
type: challenge

goal: Ship a feature on its own branch while `main` stays exactly as it is.

description: |
  `main` is what your users run, so nothing unfinished may land on it. You have just written
  `search.js` for a new search feature.

  Get it committed on a branch called `feature/search`, keep `main` where it is, and finish back
  on `main` with a clean working tree. How you get there is up to you.

difficulty: beginner

concepts:
  - branches
  - head
  - commits

commands:
  - git branch
  - git switch
  - git add
  - git commit
  - git log

setup:
  initializeGit: true
  commits:
    - message: Initial commit
      files:
        README.md: |
          # Weather App
    - message: Add homepage
      files:
        index.html: |
          <h1>Weather App</h1>
  files:
    search.js: |
      export function searchCities(cities, query) {
        const needle = query.trim().toLowerCase();
        return cities.filter((city) => city.name.toLowerCase().includes(needle));
      }

objectives:
  - id: branch
    description: A branch named `feature/search` exists.
    validator:
      type: branch_exists
      branch: feature/search

  - id: commit
    description: "`feature/search` has a commit that is not on `main`."
    validator:
      type: commit_on_branch
      branch: feature/search
      notOn: main

  - id: main-untouched
    description: "`main` still points at **Add homepage**."
    validator:
      type: branch_points_to_commit
      branch: main
      message: Add homepage

  - id: on-main
    description: You are back on `main`.
    validator:
      type: current_branch
      branch: main

  - id: clean
    description: The working tree is clean.
    validator:
      type: clean_worktree

hints:
  branch:
    - New work gets its own branch before anything is committed.
  commit:
    - A commit lands on whichever branch HEAD points to. Check where you are before committing.
  main-untouched:
    - If a commit ended up on `main`, reset the challenge and try again.
  on-main:
    - Where does HEAD point right now? The graph and `git status` both tell you.
  clean:
    - "`git status` shows whether anything is left over."

# Offered while the learner is in one of these states; see docs/lesson-authoring.md#adaptive-hints.
adaptiveHints:
  - id: committed-on-main-first
    objective: branch
    when:
      - type: current_branch
        branch: main
      - type: commit_count
        count: 3
      - type: branch_not_exists
        branch: feature/search
    hints:
      - "`main` has a new commit: a commit lands on whichever branch HEAD points to. The mission needs `main` to stay at **Add homepage**."
      - Starting over with **Reset** is the simplest way back. This time give the work its own branch, and move HEAD there, before committing.

  - id: commit-shared-with-main
    objective: commit
    when:
      - type: branch_points_to_commit
        branch: feature/search
        sameAs: main
      - type: commit_count
        count: 3
    hints:
      - The new commit is on `main` as well as `feature/search`, because it was made on `main` before the branch existed.
      - Starting over with **Reset** is the simplest way back. This time move HEAD to the new branch before committing.

  - id: committed-on-main-after-branching
    objective: commit
    when:
      - type: current_branch
        branch: main
      - type: branch_points_to_commit
        branch: feature/search
        message: Add homepage
      - type: commit_count
        count: 3
    hints:
      - "`feature/search` exists, but the new commit went onto `main`: creating a branch does not move HEAD to it."
      - Starting over with **Reset** is the simplest way back. This time move HEAD to `feature/search` before committing.

  - id: still-on-feature
    objective: on-main
    when:
      - type: current_branch
        branch: feature/search
    hints:
      - The search commit is safe on `feature/search`, and HEAD is still there. The mission ends on `main`.
      - The command that moved HEAD to the feature branch moves it back too.
