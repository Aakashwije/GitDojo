# Lesson: Commit on a Feature Branch
# Schema and authoring guide: docs/lesson-authoring.md
id: commit-on-branch
slug: commit-on-branch
title: Commit on a Feature Branch
type: interactive

goal: Keep new work on its own branch, so `main` stays untouched.

description: |
  You have written `login.js`, but it is not ready for `main` yet. Commit it on a feature
  branch instead, then switch back to `main` and see what happens to the file.

difficulty: beginner

concepts:
  - branches
  - commits
  - git-switch

commands:
  - git switch -c
  - git add
  - git commit
  - git switch

content:
  - type: diagram
    title: What you are about to build
    graph:
      commits:
        - { id: A, message: Initial commit }
        - { id: B, parent: A, message: Add homepage }
        - { id: C, parent: B, message: Add login page }
      branches:
        main: B
        feature/login: C
      head: feature/login
    caption: "`main` stays on **Add homepage** while your work lives one commit ahead on `feature/login`."

setup:
  initializeGit: true
  commits:
    - message: Initial commit
      files:
        README.md: |
          # Weather App
    - message: Add homepage
      files:
        index.html: |
          <h1>Weather App</h1>
  files:
    login.js: |
      export function login(email, password) {
        return fetch("/api/login", {
          method: "POST",
          body: JSON.stringify({ email, password }),
        });
      }

objectives:
  - id: on-feature
    description: Create a branch named `feature/login` and switch to it.
    validator:
      type: current_branch
      branch: feature/login

  - id: commit-login
    description: Commit `login.js` on `feature/login`.
    validator:
      type: commit_on_branch
      branch: feature/login
      notOn: main

  - id: main-untouched
    description: "`main` still points at **Add homepage**. Your commit is only on the feature branch."
    validator:
      type: branch_points_to_commit
      branch: main
      message: Add homepage

  - id: back-to-main
    description: Switch back to `main`, and notice that `login.js` leaves the working tree.
    validator:
      type: current_branch
      branch: main

hints:
  on-feature:
    - One `git switch` option creates the branch and switches to it.
    - Run `git switch -c feature/login`.
  commit-login:
    - Stage the file, then commit. The commit goes on the branch HEAD points to.
    - Run `git add login.js`, then `git commit -m "Add login page"`.
  main-untouched:
    - Look at the graph. Which commit does the `main` label point to?
    - If you committed on `main` by mistake, reset the lesson and switch branches first.
  back-to-main:
    - Run `git switch main`.
    - "`login.js` is committed on `feature/login`, so Git removes it while you are on `main`. Switch back and it returns."

# Offered while the learner is in one of these states; see docs/lesson-authoring.md#adaptive-hints.
adaptiveHints:
  - id: committed-on-main-first
    objective: on-feature
    when:
      - type: current_branch
        branch: main
      - type: commit_count
        count: 3
      - type: branch_not_exists
        branch: feature/login
    hints:
      - "`main` has a new commit: a commit lands on the branch HEAD points to, and that was `main`. This lesson needs `main` to stay at **Add homepage**."
      - Moving `main` back takes a command from a later lesson. Start over with **Reset** in the top bar, and create the branch before committing.
      - After resetting, run `git switch -c feature/login`, then `git add login.js` and `git commit -m "Add login page"`.

  - id: branch-created-not-switched
    objective: on-feature
    when:
      - type: branch_exists
        branch: feature/login
      - type: current_branch
        branch: main
    hints:
      - "`feature/login` exists, but HEAD is still on `main`: `git branch` creates a branch without switching to it."
      - "`git switch` moves HEAD to it, so the next commit lands there."
      - Run `git switch feature/login`.

  - id: commit-shared-with-main
    objective: commit-login
    when:
      - type: branch_points_to_commit
        branch: feature/login
        sameAs: main
      - type: commit_count
        count: 3
    hints:
      - The new commit is on `main` as well as `feature/login`, because it was made on `main` before the branch existed. This lesson needs `main` to stay at **Add homepage**.
      - Moving `main` back takes a command from a later lesson. Start over with **Reset** in the top bar, and switch to the new branch before committing.
      - After resetting, run `git switch -c feature/login`, then `git add login.js` and `git commit -m "Add login page"`.

  - id: login-staged-not-committed
    objective: commit-login
    when:
      - type: current_branch
        branch: feature/login
      - type: file_staged
        file: login.js
    hints:
      - "`login.js` is staged on `feature/login`. Only a commit puts it in the branch's history."
      - "`git commit -m` records it on the branch HEAD points to: `feature/login`."
      - Run `git commit -m "Add login page"`.
