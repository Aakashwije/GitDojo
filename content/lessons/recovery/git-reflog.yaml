# Lesson: Recover Lost Commits with git reflog
# Schema and authoring guide: docs/lesson-authoring.md
id: git-reflog
slug: git-reflog
title: Recover Lost Commits with git reflog
type: interactive

goal: Use the reflog to find commits that no branch points to any more, and bring them back.

description: |
  Ouch. While cleaning up, someone ran `git reset --hard HEAD~2` on `main`. The last two
  commits, the payment form and its validation, vanished from `git log` and from the graph.

  They are not really gone: Git still has them, and the reflog remembers where HEAD has been.
  Get them back onto `main`.

difficulty: intermediate

concepts:
  - reflog
  - reset
  - recovery

commands:
  - git reflog
  - git reset --hard
  - git log --oneline

content:
  - type: demo
    title: What a hard reset leaves behind
    steps:
      - caption: "`main` has four commits. The last two are the payment work."
        graph:
          commits:
            - { id: A, message: Initial commit }
            - { id: B, parent: A, message: Add cart }
            - { id: P, parent: B, message: Add payment form }
            - { id: V, parent: P, message: Validate card numbers }
          branches: { main: V }
          head: main
      - caption: >-
          `git reset --hard HEAD~2` moves `main` back to **Add cart**. P and V still exist, but no
          branch reaches them, so `git log` and the graph no longer show them: they are
          **unreachable**. Only the reflog remembers where HEAD was.
        command: git reset --hard HEAD~2
        graph:
          commits:
            - { id: A, message: Initial commit }
            - { id: B, parent: A, message: Add cart }
          branches: { main: B }
          head: main

  - type: example
    title: Where HEAD has been
    command: git reflog
    output: |
      1f0e6d2 (HEAD -> main) HEAD@{0}: reset: moving to HEAD~2
      a83b7c4 HEAD@{1}: commit: Validate card numbers
      52c9e10 HEAD@{2}: commit: Add payment form
      1f0e6d2 (HEAD -> main) HEAD@{3}: commit: Add cart
    explanation: >-
      Newest first. Every commit, switch, merge and reset is listed with where HEAD pointed
      afterwards. `HEAD@{1}` is where HEAD was one move ago, right before the reset.

  - type: text
    title: Two ways back
    body: |
      Any reflog entry can be used wherever Git expects a commit: `HEAD@{1}`, or the short id
      shown on the left.

      - **Move the branch back**: `git reset --hard HEAD@{1}` puts `main` (and your files) where
        they were just before the reset. Right when nothing else has happened since.
      - **Rescue onto a new branch**: `git branch rescue HEAD@{1}` gives the lost commits a name
        without moving `main` at all. Safer when `main` has new commits you want to keep; merge or
        cherry-pick from `rescue` afterwards.

  - type: callout
    tone: tip
    body: >-
      Read the reflog before you act: the message tells you what each move was
      (`commit:`, `reset:`, `checkout:`), so you can pick the entry from just before the mistake.

  - type: callout
    tone: note
    body: >-
      The reflog is local to your machine and Git eventually expires old entries, so recover
      soon. GitDojo keeps every entry.

setup:
  initializeGit: true
  commits:
    - message: Initial commit
      files:
        README.md: |
          # Shop
    - message: Add cart
      files:
        src/cart.js: |
          export const cart = [];
    - message: Add payment form
      files:
        src/payment.js: |
          export function pay(card) {}
    - message: Validate card numbers
      files:
        src/payment.js: |
          export function pay(card) {
            if (!/^\d{16}$/.test(card)) throw new Error("Invalid card");
          }
  commands:
    - git reset --hard HEAD~2

objectives:
  - id: payment
    description: "`main` contains `Add payment form` again."
    validator:
      type: branch_contains_commit
      branch: main
      message: Add payment form

  - id: validation
    description: "`main` contains `Validate card numbers` again."
    validator:
      type: branch_contains_commit
      branch: main
      message: Validate card numbers

  - id: clean
    description: The working tree is clean.
    validator:
      type: clean_worktree

hints:
  payment:
    - "`git log` only shows commits a branch can reach. Something else remembers more."
    - "`git reflog` lists where HEAD has been, including right before the reset."
    - Run `git reset --hard HEAD@{1}`, or reset to the short id next to `Validate card numbers`.
  validation:
    - Resetting to the newest lost commit brings back its parent too.
  clean:
    - "`git status` should say the working tree is clean."

# Offered while the learner is in one of these states; see docs/lesson-authoring.md#adaptive-hints.
adaptiveHints:
  - id: reset-too-far
    objective: payment
    when:
      - type: commit_count
        count: 1
    hints:
      - "`main` went back even further, to **Initial commit**. Nothing is lost: the reflog lists every position, including **Validate card numbers**."
      - "`git reflog` shows them, newest first. Reset to the entry for **Validate card numbers**."
      - Run `git reflog`, then `git reset --hard HEAD@{2}`.

  - id: files-left-behind-staged
    objective: clean
    when:
      - type: file_staged
        file: src/payment.js
    hints:
      - "`main` is back, but the files are not: a `--soft` reset moves only the branch, so the staging area still reflects the old state."
      - A `--hard` reset to where `main` already is brings the staging area and working tree in line.
      - Run `git reset --hard HEAD`.

  - id: files-left-behind
    objective: clean
    when:
      - type: file_status
        file: src/payment.js
        status: deleted
    hints:
      - "`main` is back, but `src/payment.js` is missing from the working tree: a mixed reset moves the branch and the staging area, not your files."
      - A `--hard` reset to where `main` already is brings the working tree in line.
      - Run `git reset --hard HEAD`.
