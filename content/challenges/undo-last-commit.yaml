# Challenge. Authoring guide: docs/challenge-authoring.md
# Describe the end state; never prescribe commands, not even in hints.
id: undo-last-commit
title: Undo Last Commit
category: recovery
difficulty: beginner
order: 1

scenario: |
  Your last commit, `Add API config`, accidentally included `secrets.env`, which holds a real
  API key. Luckily you have not pushed yet, so the commit can still disappear from history.

mission: >
  Rewrite the last commit so that `config.js` is committed but `secrets.env` never was, ignore
  `secrets.env` from now on, and keep history to two commits.

concepts:
  - reset
  - gitignore
  - history

requires:
  - reset

setup:
  initializeGit: true
  commits:
    - message: Initial commit
      files:
        README.md: |
          # Weather API
    - message: Add API config
      files:
        config.js: |
          export const api = { url: "https://api.example.com", keyFrom: "secrets.env" };
        secrets.env: |
          API_KEY=sk_live_51H8xQ2abcDEF

objectives:
  - id: secret-untracked
    description: "`secrets.env` is no longer tracked."
    validator:
      type: file_not_tracked
      file: secrets.env

  - id: config-committed
    description: "`config.js` is committed."
    validator:
      type: file_committed
      file: config.js

  - id: clean
    description: The working tree is clean, with `secrets.env` ignored.
    validator:
      type: clean_worktree

  - id: two-commits
    description: History still has exactly two commits, so the key is in none of them.
    validator:
      type: commit_count
      count: 2

hints:
  secret-untracked:
    - Deleting the file in a new commit would leave the key in the old one.
    - The last commit can be taken back while keeping its files.
  config-committed:
    - Commit only what belongs in the repository.
  clean:
    - Git can be told to stop reporting a file.
  two-commits:
    - If history has three commits, the key is still in one of them.

# Feedback while a state that leads away from the mission holds. First match wins.
tips:
  - id: extra-commit
    when:
      - type: commit_count
        count: 3
    text: >-
      History has three commits. A commit that deletes `secrets.env` still leaves the key readable
      in the commit that added it, so the mission keeps history at two: the commit holding the key
      has to stop existing rather than be followed by another one.

  - id: ignoring-a-tracked-file
    when:
      - type: file_exists
        file: .gitignore
      - type: file_committed
        file: secrets.env
    text: >-
      `.gitignore` is there, but `secrets.env` is still tracked. Ignore rules only apply to files
      Git is not tracking yet; one that is already in history keeps being reported and committed
      whatever the rules say.

# Offered while the learner is in one of these states; see docs/challenge-authoring.md#adaptive-hints.
adaptiveHints:
  - id: secret-staged-again
    objective: config-committed
    when:
      - type: commit_count
        count: 1
      - type: file_staged
        file: secrets.env
    hints:
      - History is back to one commit, but `secrets.env` is staged again, so the next commit would record the key once more.
      - Take it back out of the staging area; the file itself stays on disk.

  - id: config-loose
    objective: config-committed
    when:
      - type: commit_count
        count: 1
      - type: file_status
        file: config.js
        status: untracked
    hints:
      - The last commit is taken back, so `config.js` and `secrets.env` are both loose in the working tree.
      - Record `config.js` without the key. A file telling Git to ignore `secrets.env` can go in the same commit, which keeps history at two.

  - id: removal-staged
    objective: clean
    when:
      - type: commit_count
        count: 2
      - type: file_staged
        file: secrets.env
    hints:
      - "`secrets.env` is about to stop being tracked, but committing that would make a third commit and leave the key in `Add API config`."
      - The commit holding the key itself has to be taken back, keeping its files.

  - id: ignore-file-not-committed
    objective: clean
    when:
      - type: file_status
        file: .gitignore
        status: untracked
    hints:
      - "`.gitignore` exists but is not committed, and committing it on its own would make a third commit."
      - Take the last commit back again, keeping its files, and record `config.js` and `.gitignore` together.

  - id: secret-still-reported
    objective: clean
    when:
      - type: file_status
        file: secrets.env
        status: untracked
    hints:
      - "`secrets.env` is untracked but still reported, so the working tree is not clean."
      - Git reads a list of paths to stop reporting from a special file at the top of the project, and it should be in the same commit as `config.js`.
