# Challenge. Authoring guide: docs/challenge-authoring.md
# Describe the end state; never prescribe commands, not even in hints.
id: uncommitted-changes
title: Uncommitted Changes
category: branching
difficulty: intermediate
order: 3

scenario: |
  You are on `main`, in the middle of reworking the price formatting in `src/price.js`. It is
  not ready to commit. Then: production is down, and the fix on `hotfix/rounding` has to be
  merged into `release` right now. `release` has its own version of `src/price.js`.

mission: >
  Merge `hotfix/rounding` into `release`, then get back to `main` with your unfinished price
  work exactly as it was, not committed, and nothing left stashed.

concepts:
  - stash
  - branches
  - merging

requires:
  - stash

setup:
  initializeGit: true
  commits:
    - message: Initial commit
      files:
        README.md: |
          # Storefront
        src/price.js: |
          export const price = (cents) => cents / 100;
    - message: Prepare release
      branch: release
      files:
        src/price.js: |
          export const price = (cents) => (cents / 100).toFixed(2);
    - message: Round prices correctly
      branch: hotfix/rounding
      files:
        src/round.js: |
          export const round = (value) => Math.round(value * 100) / 100;
  files:
    src/price.js: |
      export const price = (cents, currency = "EUR") => `${cents / 100} ${currency}`;

objectives:
  - id: hotfix-merged
    description: "`release` contains the rounding fix."
    validator:
      type: branches_merged
      branch: hotfix/rounding
      into: release

  - id: back-on-main
    description: You are back on `main`.
    validator:
      type: current_branch
      branch: main

  - id: work-restored
    description: "Your price rework is back in `src/price.js`, uncommitted."
    validator:
      type: file_status
      file: src/price.js
      status: modified

  - id: nothing-stashed
    description: Nothing is left in the stash.
    validator:
      type: stash_count
      count: 0

hints:
  hotfix-merged:
    - Try switching first, and read why Git refuses.
    - Unfinished work can be put aside without a commit and brought back later.
  back-on-main:
    - The merge happens on the branch that receives the fix.
  work-restored:
    - Whatever you put aside is still waiting for you.
  nothing-stashed:
    - Bringing work back does not always remove it from the list.

# Feedback while a state that leads away from the mission holds. First match wins.
tips:
  - id: hotfix-on-main
    when:
      - type: branches_merged
        branch: hotfix/rounding
        into: main
      - type: commit_not_on_branch
        branch: release
        message: Round prices correctly
    text: >-
      `main` now contains the rounding fix and `release` does not. The mission puts the hotfix
      into `release`; checking which branches contain that commit shows where it landed.

  - id: rework-missing
    when:
      - type: branches_merged
        branch: hotfix/rounding
        into: release
      - type: stash_count
        count: 0
      - type: file_status
        file: src/price.js
        status: committed
    text: >-
      The hotfix is merged and the stash is empty, but `src/price.js` has no uncommitted changes,
      so the unfinished price rework is not waiting in the working tree. The mission wants it back
      exactly as it was, not committed. The file's history and the stash list are the two places
      worth looking.

  - id: stash-left-behind
    when:
      - type: branches_merged
        branch: hotfix/rounding
        into: release
      - type: file_status
        file: src/price.js
        status: modified
      - type: stash_count
        count: 1
    text: >-
      Your price rework is back, but the stash still holds an entry. Bringing shelved work back
      and taking it off the list are two different things, and the stash list shows what is still
      held.
